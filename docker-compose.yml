services:
  # 1. Base de Datos Espacial PostgreSQL 16 con PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: agrochain-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-agrochain}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - agrochain_pgdata:/var/lib/postgresql/data
      - ./backend/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agrochain}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Servidor Backend REST API (Node.js 22 + TypeScript + N-Capas)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrochain-backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-3000}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      DB_NAME: ${POSTGRES_DB:-agrochain}
      JWT_SECRET: ${JWT_SECRET:-agrochain-super-secret-production-key-2026}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  # 3. Portal Web SPA (React 18 + Bootstrap 5 + Leaflet + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agrochain-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  agrochain_pgdata:
    driver: local
